experiment: xreal_mobilenet_hmd_plus_air2
seed: 42

data:
  type: coco_keypoints
  input_size: [256, 256]
  heatmap_size: [64, 64]
  sigma: 3.0

  batch_size: 32
  val_batch_size: 32
  num_workers: 0

  # Mix multiple COCO-style datasets for training.
  # Each entry contributes samples to the same training loader.
  # loss_weight scales the contribution of that dataset to the loss.
  train_datasets:
    - name: hmd_xreal
      json_path: "datasets/hmd_xreal/annotations/train.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0

    - name: 300w_xreal_air2
      json_path: "datasets/300W-xreal_air2/annotations/train.json"
      image_root: "datasets/300W-xreal_air2"
      weight: 0.3

  # Multi-dataset validation.
  # - Trainer evaluates each val set and logs metrics as val/<metric>_<name>.
  # - A weighted aggregate loss Val(agg) is used for checkpoint selection.
  # - primary_val controls which val set is also logged as val/pck and val/nme.
  primary_val: hmd_xreal
  val_datasets:
    - name: hmd_xreal
      json_path: "datasets/hmd_xreal/annotations/val.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0

    - name: 300w_xreal_air2
      json_path: "datasets/300W-xreal_air2/annotations/val.json"
      image_root: "datasets/300W-xreal_air2"
      weight: 1.0

  aug:
    enabled: true
    use_bbox_crop: true
    face_margin: 0.5
    hflip_p: 0.5
    flip_pairs:
      - [0, 9]
      - [1, 10]
      - [2, 11]
      - [3, 12]
      - [4, 13]
      - [5, 14]
      - [6, 15]
      - [7, 16]
      - [8, 17]
      - [18, 33]
      - [19, 32]
      - [20, 31]
      - [21, 30]
      - [22, 29]
      - [23, 28]
      - [24, 27]
      - [34, 37]
      - [35, 38]
      - [40, 46]
      - [41, 47]
      - [42, 48]
      - [43, 49]
      - [44, 50]
      - [45, 51]
      - [52, 58]
      - [53, 59]
      - [54, 60]
      - [55, 61]
      - [56, 62]
      - [57, 63]
      - [64, 66]
      - [65, 67]
    rotation: 30
    scale: 0.1
    color_jitter: 0.10
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.1
      motion_blur_p: 0.1
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

  # val_aug:
  #   enabled: false
  #   use_bbox_crop: true
  #   face_margin: 0.5

model:
  name: mobilenet_pose

loss:
  name: heatmap_mse

train:
  epochs: 80
  optimizer:
    name: adam
    lr: 0.0005
    weight_decay: 0.0001
  scheduler:
    name: multistep
    milestones: [40, 50]
    gamma: 0.1
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  num_val_viz: 4
  output_dir: "work_dirs/xreal_mobilenet_hmd_plus_air2"
