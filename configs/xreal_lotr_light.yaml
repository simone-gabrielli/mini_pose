# Configuration for LOTR-Light: Lightweight variant for real-time applications
# Smaller dimensions and fewer layers for faster inference

experiment: xreal_lotr_light
seed: 42

data:
  type: coco_keypoints
  train_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/300W-xreal_air2/annotations/train.json"
  image_root: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/300W-xreal_air2/"

  # Multi-dataset validation.
  # Keep air2 as primary (matches previous single-val behavior), but also report metrics on hmd_xreal.
  primary_val: 300w_xreal_air2
  val_datasets:
    - name: 300w_xreal_air2
      val_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/300W-xreal_air2/annotations/val.json"
      image_root: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/300W-xreal_air2/"
      weight: 1.0

    - name: hmd_xreal
      val_json: "datasets/hmd_xreal/annotations/val.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0
  input_size: [192, 192]      # Smaller input for speed
  heatmap_size: [48, 48]
  batch_size: 64              # Larger batch size due to smaller model
  num_workers: 0
  aug:
    use_bbox_crop: true
    face_margin: 0.5
    hflip_p: 0.5
    flip_pairs:
      - [0, 9]
      - [1, 10]
      - [2, 11]
      - [3, 12]
      - [4, 13]
      - [5, 14]
      - [6, 15]
      - [7, 16]
      - [8, 17]
      - [18, 33]
      - [19, 32]
      - [20, 31]
      - [21, 30]
      - [22, 29]
      - [23, 28]
      - [24, 27]
      - [34, 37]
      - [35, 38]
      - [40, 46]
      - [41, 47]
      - [42, 48]
      - [43, 49]
      - [44, 50]
      - [45, 51]
      - [52, 58]
      - [53, 59]
      - [54, 60]
      - [55, 61]
      - [56, 62]
      - [57, 63]
      - [64, 66]
      - [65, 67]
    rotation: 30
    scale: 0.15
    color_jitter: 0.15
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.1
      motion_blur_p: 0.1
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: lotr_light
  # Lightweight configuration (similar to LOTR-M from paper)
  backbone: mobilenet_v2
  d_model: 64                # Reduced dimension
  nhead: 4
  num_encoder_layers: 1
  num_decoder_layers: 1
  dim_feedforward: 256
  dropout: 0.1
  use_upsampling: false      # Skip upsampling for speed
  pretrained: true

loss:
  name: smooth_wing
  w: 10.0
  eps: 2.0
  t: 2.0

train:
  epochs: 100
  lr: 0.0002
  weight_decay: 0.0001
  optimizer: adam
  lr_schedule: multistep
  lr_steps: [60, 80]
  lr_gamma: 0.1
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr: 0.0
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  output_dir: "work_dirs/xreal_lotr_light"
