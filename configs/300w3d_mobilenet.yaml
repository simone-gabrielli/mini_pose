experiment: 300w3d_mobilenet
seed: 1337

data:
  type: coco_keypoints
  train_json: "datasets/300W-3D/annotations/train.json"
  val_json: "datasets/300W-3D/annotations/val.json"
  image_root: "datasets/300W-3D"
  input_size: [256, 256]
  heatmap_size: [64, 64]
  batch_size: 32
  num_workers: 0
  aug:
    use_bbox_crop: true
    face_margin: 0.25
    rotation: 30
    scale: 0.1
    color_jitter: 0.10
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.15
      motion_blur_p: 0.15
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: mobilenet_pose

loss:
  name: heatmap_mse

train:
  epochs: 80
  lr: 0.0005
  weight_decay: 0.0001
  optimizer: adam
  lr_steps: [50, 70]
  lr_gamma: 0.1
  output_dir: "work_dirs/300w3d_mobilenet"
