experiment: mobilenet_300w3d
seed: 1337

data:
  type: coco_keypoints
  train_json: "datasets/300W-3D/annotations/train.json"
  val_json: "datasets/300W-3D/annotations/val.json"
  image_root: "datasets/300W-3D"
  input_size: [256, 256]
  heatmap_size: [128, 128]
  batch_size: 32
  num_workers: 0
  aug:
    use_bbox_crop: true
    face_margin: 0.25
    rotation: 30
    scale: 0.25
    color_jitter: 0.10
    hflip_prob: 0.5

model:
  name: mobilenet_pose

loss:
  name: heatmap_mse

train:
  epochs: 80
  lr: 0.0005
  weight_decay: 0.0001
  optimizer: adam
  lr_steps: [50, 70]
  lr_gamma: 0.1
  output_dir: "work_dirs/mobilenet_300w3d"
