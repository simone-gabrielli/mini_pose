experiment: xreal_fan2d
seed: 42

data:
  type: coco_keypoints
  input_size: [256, 256]
  heatmap_size: [64, 64]
  sigma: 3.0

  train_datasets:
    - name: hmd_xreal_v3
      json_path: "datasets/hmd_xreal/annotations_v3/train.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0

  primary_val: hmd_xreal_v3
  val_datasets:
    - name: hmd_xreal_v3
      json_path: "datasets/hmd_xreal/annotations_v3/val.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0

  batch_size: 8
  num_workers: 0
  aug:
    use_bbox_crop: true
    face_margin: 0.25
    hflip_p: 0.5
    flip_pairs:
      - [0, 9]
      - [1, 10]
      - [2, 11]
      - [3, 12]
      - [4, 13]
      - [5, 14]
      - [6, 15]
      - [7, 16]
      - [8, 17]
      - [18, 33]
      - [19, 32]
      - [20, 31]
      - [21, 30]
      - [22, 29]
      - [23, 28]
      - [24, 27]
      - [34, 37]
      - [35, 38]
      - [40, 46]
      - [41, 47]
      - [42, 48]
      - [43, 49]
      - [44, 50]
      - [45, 51]
      - [52, 58]
      - [53, 59]
      - [54, 60]
      - [55, 61]
      - [56, 62]
      - [57, 63]
      - [64, 66]
      - [65, 67]
    rotation: 30      # FAN-like rotation
    scale: 0.0
    color_jitter: 0.10
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.15
      motion_blur_p: 0.15
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: fan_2d
  num_stacks: 4   # nStacks
  num_modules: 1  # nModules
  num_feats: 256  # nFeats

loss:
  name: heatmap_mse

train:
  epochs: 200
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: multistep
    milestones: [30, 50]
    gamma: 0.1
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  num_val_viz: 4
  output_dir: "work_dirs/xreal_fan2d"
