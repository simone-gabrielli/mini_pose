# Configuration for LOTR (Localization Transformer) facial landmark detection
# Based on: "LOTR: Face Landmark Localization Using Localization Transformer"
# Watchareeruetai et al., IEEE Access, 2022

experiment: xreal_lotr
seed: 42

data:
  type: coco_keypoints
  input_size: [256, 256]      # Standard input size for LOTR
  # Not heatmap based, so no heatmap_size or sigma needed

  batch_size: 16
  val_batch_size: 16
  num_workers: 4

  # Mix multiple COCO-style datasets for training.
  # Each entry contributes samples to the same training loader.
  # loss_weight scales the contribution of that dataset to the loss.
  train_datasets:
    - name: hmd_xreal
      json_path: "datasets/hmd_xreal/annotations/train.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0

    - name: 300w_xreal_air2
      json_path: "datasets/300W-xreal_air2/annotations/train.json"
      image_root: "datasets/300W-xreal_air2"
      weight: 0.4

  # Multi-dataset validation.
  primary_val: hmd_xreal
  val_datasets:
    - name: hmd_xreal
      json_path: "datasets/hmd_xreal/annotations/val.json"
      image_root: "datasets/hmd_xreal/images"
      weight: 1.0

    - name: 300w_xreal_air2
      json_path: "datasets/300W-xreal_air2/annotations/val.json"
      image_root: "datasets/300W-xreal_air2"
      weight: 0.2

  aug:
    enabled: true
    use_bbox_crop: true
    face_margin: 0.5
    bbox_offset_p: 0.25
    bbox_offset_max_frac: 0.5
    keep_oob_visible: true
    hflip_p: 0.5
    flip_pairs:
      - [0, 9]
      - [1, 10]
      - [2, 11]
      - [3, 12]
      - [4, 13]
      - [5, 14]
      - [6, 15]
      - [7, 16]
      - [8, 17]
      - [18, 33]
      - [19, 32]
      - [20, 31]
      - [21, 30]
      - [22, 29]
      - [23, 28]
      - [24, 27]
      - [34, 37]
      - [35, 38]
      - [40, 46]
      - [41, 47]
      - [42, 48]
      - [43, 49]
      - [44, 50]
      - [45, 51]
      - [52, 58]
      - [53, 59]
      - [54, 60]
      - [55, 61]
      - [56, 62]
      - [57, 63]
      - [64, 66]
      - [65, 67]
    rotation: 30
    scale: 0.15
    color_jitter: 0.15
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.1
      motion_blur_p: 0.1
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]
      clahe_p: 0.05
      gamma_p: 0.10
      hsv_p: 0.10
      rgb_shift_p: 0.05
      shadow_p: 0.05
      fog_p: 0.0
      blur_p: 0.05
      coarse_dropout_p: 0.0

    occlusion:
      p: 0.25
      within_bbox: true
      max_holes: 2
      min_area: 0.02
      max_area: 0.15
      min_aspect: 0.3
      max_aspect: 3.0
      fill_mode: random

  # val_aug:
  #   enabled: false
  #   use_bbox_crop: true
  #   face_margin: 0.5

model:
  name: lotr
  # Visual backbone: 'mobilenet_v2' (lightweight) or 'resnet50' (higher accuracy)
  backbone: mobilenet_v2
  # Transformer dimensions
  d_model: 256               # Hidden dimension (paper uses 64 for LOTR-M, 256 for others)
  nhead: 8                   # Number of attention heads
  num_encoder_layers: 2      # Number of transformer encoder layers
  num_decoder_layers: 2      # Number of transformer decoder layers
  dim_feedforward: 512       # FFN hidden dimension (paper uses 512)
  dropout: 0.1
  # Upsampling: increases feature resolution before transformer
  use_upsampling: true
  upsampling_layers: 2       # 2 layers = 4x upsampling (8x8 -> 32x32)
  pretrained: true
  constrain_coords: false
  predict_confidence: true

loss:
  name: smooth_wing
  # Smooth-Wing loss parameters (from paper)
  w: 10.0                    # Outer threshold
  eps: 2.0                   # Steepness parameter
  t: 2.0                     # Inner threshold for L2 region
  use_uncertainty: true      # Learn per-landmark confidence via heteroscedastic NLL
  lambda_conf: 0.08
  sigma: 0.05
  confidence_correct_thresh: 0.05

train:
  epochs: 200
  optimizer:
    name: adam
    lr: 0.0001                 # Lower LR for transformers
    weight_decay: 0.0001
  scheduler:
    name: cosine
    warmup_epochs: 5
    warmup_start_factor: 0.1
    min_lr: 0.0
  grad_clip_norm: 0.0
  amp:
    enabled: true
    dtype: fp16
  ema:
    enabled: true
    decay: 0.999
    update_every: 1
    eval: true
  num_val_viz: 4
  output_dir: "work_dirs/xreal_lotr"
