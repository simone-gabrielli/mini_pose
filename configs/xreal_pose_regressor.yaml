experiment: xreal_pose_regressor
seed: 42

# NOTE: this config assumes you have:
#   1) A CAD model points file at `cad_model_path` (np.load-able, shape (N,3)).
#   2) COCO-style annotations where each image has a set of 2D keypoints that
#      correspond 1:1 to those CAD points. The dataset class below will expect
#      those as `pose_keypoints_2d` and `pose_weights` tensors.

data:
  # Reuse coco_keypoints dataset type for now; you can swap to a
  # dedicated pose dataset if you create one and register it.
  type: coco_keypoints
  input_size: [256, 256]

  train_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations_v3/train.json"
  val_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations_v3/val.json"
  image_root: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/images"
  
  batch_size: 32
  num_workers: 0
  aug:
    use_bbox_crop: false
    face_margin: 0.25
    hflip_p: 0.5
    flip_pairs:
      - [0, 9]
      - [1, 10]
      - [2, 11]
      - [3, 12]
      - [4, 13]
      - [5, 14]
      - [6, 15]
      - [7, 16]
      - [8, 17]
      - [18, 33]
      - [19, 32]
      - [20, 31]
      - [21, 30]
      - [22, 29]
      - [23, 28]
      - [24, 27]
      - [34, 37]
      - [35, 38]
      - [40, 46]
      - [41, 47]
      - [42, 48]
      - [43, 49]
      - [44, 50]
      - [45, 51]
      - [52, 58]
      - [53, 59]
      - [54, 60]
      - [55, 61]
      - [56, 62]
      - [57, 63]
      - [64, 66]
      - [65, 67]
    rotation: 0
    scale: 0.
    color_jitter: 0.10
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.15
      motion_blur_p: 0.15
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: glasses_pose_regressor
  # num_keypoints is injected by Trainer, but unused by this model.
  fx: 701.66
  fy: 700.69
  cx: 632.93
  cy: 345.93
  cad_model_path: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations_v3/xreal_one_68_v3.xml"
  pretrained: true

loss:
  name: pose_reprojection
  robust: charbonnier
  epsilon: 1.0e-3

train:
  epochs: 300
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adam
  lr_schedule: multistep
  lr_steps: [100, 200]
  lr_gamma: 0.1
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr: 0.0
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  output_dir: "work_dirs/xreal_pose_regressor"
