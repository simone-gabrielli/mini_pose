experiment: xreal_fan3d_DEPRECATED
seed: 42

data:
  type: coco_keypoints
  train_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations/train.json"
  val_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations/val.json"
  image_root: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/images"
  input_size: [256, 256]
  heatmap_size: [256, 256]
  batch_size: 16
  num_workers: 0
  # sigma for GT Gaussian on heatmaps. Scale proportionally when increasing heatmap_size.
  sigma: 5.0
  aug:
    use_bbox_crop: true
    face_margin: 0.25
    hflip_p: 0.5
    flip_pairs:
      - [0, 9]
      - [1, 10]
      - [2, 11]
      - [3, 12]
      - [4, 13]
      - [5, 14]
      - [6, 15]
      - [7, 16]
      - [8, 17]
      - [18, 33]
      - [19, 32]
      - [20, 31]
      - [21, 30]
      - [22, 29]
      - [23, 28]
      - [24, 27]
      - [34, 37]
      - [35, 38]
      - [40, 46]
      - [41, 47]
      - [42, 48]
      - [43, 49]
      - [44, 50]
      - [45, 51]
      - [52, 58]
      - [53, 59]
      - [54, 60]
      - [55, 61]
      - [56, 62]
      - [57, 63]
      - [64, 66]
      - [65, 67]
    rotation: 30      # FAN-like rotation
    scale: 0.0
    color_jitter: 0.10
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.15
      motion_blur_p: 0.15
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: fan3d
  num_stacks: 4
  num_modules: 1
  num_feats: 256
  depth_channels: 1

loss:
  name: heatmap_mse
  depth: depth_mse

train:
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  lr_schedule: multistep
  lr_steps: [30, 50]
  lr_gamma: 0.1
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr: 0.0
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  output_dir: "work_dirs/xreal_fan3d_DEPRECATED"
