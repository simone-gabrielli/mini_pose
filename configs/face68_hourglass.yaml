experiment: face68_hourglass
seed: 42

data:
  type: coco_keypoints
  train_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations/train.json"
  val_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations/val.json"
  image_root: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/images"
  input_size: [512, 512]
  heatmap_size: [64, 64]
  batch_size: 16
  num_workers: 0
  aug:
    rotation: 10      # max degrees
    scale: 0.10       # +/- scale range
    color_jitter: 0.10
    hflip_prob: 0.5

model:
  name: stacked_hourglass
  num_stacks: 2
  num_blocks: 1
  num_feats: 256

loss:
  name: heatmap_mse

train:
  epochs: 5
  lr: 0.00025
  weight_decay: 0.0001
  optimizer: "adam"
  lr_steps: [30, 40]
  lr_gamma: 0.1
  output_dir: "work_dirs/face68_hourglass"
