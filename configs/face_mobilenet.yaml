experiment: face_mobilenet
seed: 1337

data:
  type: coco_face
  train_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations/train.json"
  val_json: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/annotations/val.json"
  image_root: "C:/Users/simog/hmdrive/head_tracking/mini_pose/datasets/hmd_xreal/images"
  input_size: [256, 256]
  heatmap_size: [64, 64]
  batch_size: 32
  num_workers: 0
  aug:
    use_bbox_crop: true
    face_margin: 0.25
    hflip_p: 0.5
    rotation: 15
    scale: 0.1
    color_jitter: 0.15
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.15
      motion_blur_p: 0.15
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: tiny_face
  pretrained: true
  embed_dim: 512

train:
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"
  lr_schedule: multistep
  lr_steps: [20, 25]
  lr_gamma: 0.1
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr: 0.0
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  output_dir: "work_dirs/face_mobilenet"
