experiment: xreal_fan_hmd_plus_air2
seed: 42

data:
  type: coco_keypoints

  # Mix multiple COCO-style datasets for training.
  # Each entry contributes samples to the same training loader.
  # loss_weight scales the contribution of that dataset to the loss.
  train_datasets:
    - name: hmd_xreal
      train_json: "datasets/hmd_xreal/annotations/train.json"
      image_root: "datasets/hmd_xreal/images"
      loss_weight: 1.0

    - name: 300w_xreal_air2
      train_json: "datasets/300W-xreal_air2/annotations/train.json"
      image_root: "datasets/300W-xreal_air2"
      loss_weight: 0.3

  # Validation is currently a single dataset.
  # Pick whichever distribution you care about most for checkpoint selection.
  val_json: "datasets/hmd_xreal/annotations/val.json"
  val_image_root: "datasets/hmd_xreal/images"

  input_size: [256, 256]
  heatmap_size: [64, 64]
  batch_size: 8
  num_workers: 0
  aug:
    use_bbox_crop: true
    face_margin: 0.5
    hflip_p: 0.5
    flip_pairs:
      - [0, 16]
      - [1, 15]
      - [2, 14]
      - [3, 13]
      - [4, 12]
      - [5, 11]
      - [6, 10]
      - [7, 9]
      - [17, 26]
      - [18, 25]
      - [19, 24]
      - [20, 23]
      - [21, 22]
      - [31, 35]
      - [32, 34]
      - [36, 45]
      - [37, 44]
      - [38, 43]
      - [39, 42]
      - [40, 47]
      - [41, 46]
      - [48, 54]
      - [49, 53]
      - [50, 52]
      - [55, 59]
      - [56, 58]
      - [60, 64]
      - [61, 63]
      - [65, 67]
    rotation: 30
    scale: 0.1
    color_jitter: 0.10
    aug_factor: 1
    content:
      brightness_contrast_p: 0.5
      sunflare_p: 0.1
      motion_blur_p: 0.1
      gauss_noise_p: 0.2
      gauss_noise_var: [10.0, 50.0]
      compression_p: 0.2
      compression_quality: [60, 100]

model:
  name: fan_2d
  num_stacks: 4   # nStacks
  num_modules: 1  # nModules
  num_feats: 256  # nFeats

loss:
  name: heatmap_mse

train:
  epochs: 80
  lr: 0.0005
  weight_decay: 0.0001
  optimizer: adam
  lr_schedule: multistep
  lr_steps: [40, 50]
  lr_gamma: 0.1
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr: 0.0
  grad_clip_norm: 0.0
  amp:
    enabled: false
    dtype: fp16
  ema:
    enabled: false
    decay: 0.999
    update_every: 1
    eval: true
  output_dir: "work_dirs/xreal_fan_hmd_plus_air2"
